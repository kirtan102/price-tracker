[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "price-tracker-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
  "python-jose[cryptography]>=3.3,<4", "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.27,<1", "apscheduler>=3.10,<4", "firebase-admin>=6.5,<7",
  "tenacity>=9,<10", "pytest>=8,<9", "pytest-asyncio>=0.24,<1", "aiosqlite>=0.20,<1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

